<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#171a33"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d4fe0"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<radialGradient id="orb"><stop offset="0" stop-color="#6d4fe0" stop-opacity=".35"/><stop offset="1" stop-color="#6d4fe0" stop-opacity="0"/></radialGradient>
<linearGradient id="p0" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#b9a8ff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="p1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#ffb3d1"/><stop offset="1" stop-color="#fb923c"/></linearGradient><linearGradient id="p2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#a7f3d0"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".07"/></pattern>
<style>
.sub{font:500 18px 'Courier New',Consolas,monospace;letter-spacing:3px;fill:#22d3ee}
.tag{font:400 14px 'Courier New',Consolas,monospace;letter-spacing:2px;fill:#8b94a7}
.code{font:700 22px 'Courier New',Consolas,monospace;fill:#8b6cf6}
.clip{width:0;animation-duration:24s;animation-iteration-count:infinite;animation-delay:var(--d)}
.caret{opacity:0;animation-duration:24s;animation-iteration-count:infinite;animation-delay:var(--d)}
.blink{animation:bl 1s steps(1) infinite}
.gl1{animation:g1 .5s steps(2) infinite}.gl2{animation:g2 .5s steps(2) infinite}
.f1{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.f2{animation:fl2 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spin{animation:sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.orb{animation:ob 8s ease-in-out infinite}
.shine{animation:sh 3s ease-in-out infinite}
@keyframes bl{60%{opacity:0}}
@keyframes ob{50%{transform:translate(60px,20px)}}
@keyframes sh{0%{transform:translateX(-40px)}100%{transform:translateX(150px)}}
@keyframes g1{0%{transform:translate(-3px,1px)}100%{transform:translate(2px,-1px)}}
@keyframes g2{0%{transform:translate(3px,-1px)}100%{transform:translate(-2px,2px)}}
@keyframes fl{50%{transform:translateY(-12px)}}@keyframes fl2{50%{transform:translateY(10px)}}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
</style>
