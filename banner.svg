s ty4{0%{width:0}5.00%{width:410px}12.33%{width:410px}15.83%,100%{width:0}}@keyframes cr4{0%{opacity:1;transform:translateX(0)}5.00%{transform:translateX(410px)}12.33%{transform:translateX(410px)}15.83%{opacity:1;transform:translateX(0)}16.23%,100%{opacity:0;transform:translateX(0)}}</style><clipPath id="c5"><rect class="clip" x="60" y="60" height="130" style="--d:20s;animation-name:ty5;animation-timing-function:steps(17,end)"/></clipPath><style>@keyframes ty5{0%{width:0}5.00%{width:520px}12.33%{width:520px}15.83%,100%{width:0}}@keyframes cr5{0%{opacity:1;transform:translateX(0)}5.00%{transform:translateX(520px)}12.33%{transform:translateX(520px)}15.83%{opacity:1;transform:translateX(0)}16.23%,100%{opacity:0;transform:translateX(0)}}</style>
