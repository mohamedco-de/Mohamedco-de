<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#171a33"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d4fe0"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <style>
      .title { font: 800 74px 'Courier New', Consolas, monospace; letter-spacing: 8px; fill: #ffffff; }
      .sub   { font: 500 20px 'Courier New', Consolas, monospace; letter-spacing: 3px; fill: #22d3ee; }
      .tag   { font: 400 15px 'Courier New', Consolas, monospace; letter-spacing: 2px; fill: #8b94a7; }
      .code  { font: 700 22px 'Courier New', Consolas, monospace; fill: #8b6cf6; }
      .f1 { animation: float1 5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .f2 { animation: float2 6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .f3 { animation: float1 7s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .spin { animation: spin 14s linear infinite; transform-origin: center; transform-box: fill-box; }
      .blink { animation: blink 1.2s steps(1) infinite; }
      @keyframes float1 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes float2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(10px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="900" height="280" rx="18" fill="url(#bg)"/>
  <rect width="900" height="280" rx="18" fill="url(#dots)"/>
  <rect x="1" y="1" width="898" height="278" rx="17" fill="none" stroke="#6d4fe0" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Text -->
  <text x="60" y="78" class="code">&lt; / &gt;</text>
  <text x="56" y="160" class="title">MOHAMED</text>
  <text x="60" y="205" class="sub">DEV<tspan class="blink" fill="#8b6cf6">_</tspan></text>
  <rect x="60" y="222" width="120" height="5" rx="2.5" fill="url(#bar)"/>
  <text x="200" y="228" class="tag">Full-Stack Developer · Creative Engineer</text>

  <!-- Shapes -->
  <g class="f1">
    <polygon points="640,110 680,50 600,50" fill="none" stroke="#8b6cf6" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g class="f2">
    <circle cx="760" cy="95" r="42" fill="none" stroke="#8b6cf6" stroke-width="3"/>
    <circle cx="760" cy="95" r="26" fill="#2a2d52"/>
  </g>
  <g class="spin">
    <rect x="715" y="175" width="52" height="52" rx="10" fill="none" stroke="#22d3ee" stroke-width="3"/>
  </g>
  <g class="f3">
    <circle cx="830" cy="190" r="15" fill="#22d3ee"/>
    <circle cx="830" cy="190" r="6" fill="#0d1117"/>
  </g>
  <g stroke="#8b6cf6" stroke-width="3" stroke-linecap="round">
    <path d="M850 40 v18 M841 49 h18"/>
    <path d="M630 215 v16 M622 223 h16" stroke="#22d3ee"/>
  </g>
</svg>
